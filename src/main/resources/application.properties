# Kafka
kafka.bootstrap.servers=185.204.170.204:9092
kafka.topic=message-archive
kafka.consumer.group.id=chat-message-persistence2
kafka.dlt.topic=chat-messages.DLT
kafka.max.poll.records=50
kafka.poll.timeout.ms=1000

# Storage backend selector - see MessageRepositoryFactory
storage.type=redis

# Redis
redis.host=185.204.170.204
redis.port=6379
redis.connect.timeout.ms=3000
redis.so.timeout.ms=3000

# Resilience
storage.retry.max.attempts=3
storage.retry.initial.backoff.ms=200
infra.retry.backoff.ms=2000
